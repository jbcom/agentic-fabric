[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-agentic-fabric"
version = "0.3.3"
description = "Pytest fixtures for projects built on agentic-fabric"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Jon Bogaty", email = "jon@jonbogaty.com" }]
maintainers = [{ name = "Jon Bogaty", email = "jon@jonbogaty.com" }]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pytest-mock>=3.15.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
tests = [
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.1.1",
]
typing = [
    "mypy>=2.1.0",
]
dev = [
    "pytest-agentic-fabric[tests,typing]",
    "ruff>=0.16.0",
]

[project.entry-points.pytest11]
agentic_fabric = "pytest_agentic_fabric.plugin"

[project.urls]
Documentation = "https://agentic.coach/"
Issues = "https://github.com/jbcom/agentic-fabric/issues"
Source = "https://github.com/jbcom/agentic-fabric"
Changelog = "https://github.com/jbcom/agentic-fabric/blob/main/packages/pytest-agentic-fabric/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_agentic_fabric"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
parallel = true
source = ["pytest_agentic_fabric"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "ARG",
    "BLE001",
    "C901",
    "COM",
    "CPY",
    "D105",
    "D205",
    "D415",
    "D417",
    "DTZ007",
    "E402",
    "E501",
    "EM",
    "ERA001",
    "FBT",
    "FIX",
    "G",
    "PERF",
    "PLC0415",
    "PLR0124",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "PTH",
    "RET505",
    "RUF012",
    "S105",
    "S110",
    "S310",
    "S603",
    "SLF001",
    "TCH",
    "TD",
    "TID252",
    "TRY003",
    "TRY300",
    "TRY301",
    "TRY401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "BLE", "D", "DTZ", "INP001", "LOG001", "N802", "N803", "N806", "PLC0415", "PT", "S", "SIM117", "TRY"]
# N802: MagicMock/Mock properties intentionally mirror unittest.mock's PascalCase names.
"src/pytest_agentic_fabric/mocking.py" = ["N802"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2
