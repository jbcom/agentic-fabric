name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e "py$(echo '${{ matrix.python-version }}' | tr -d '.')"

  quality:
    name: Quality, Sourcey docs, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev
      - run: uv tool install tox --with tox-uv --with tox-gh
      - run: tox -e lint,typecheck,audit,examples,coverage,plugin,docs,build

  dependency-review:
    name: Dependency Review / gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  repository-policy:
    name: Repository Policy / gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject sensitive control-plane edits from forks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            if (pull.head.repo.full_name === context.repo.owner + "/" + context.repo.repo) {
              core.info("Same-upstream pull request; trusted branch policy applies.");
              return;
            }
            const sensitive = [
              ".github/workflows/", ".github/actions/", ".github/dependabot.yml",
              ".coderabbit.yaml", "sonar-project.properties", "release-please-config.json",
              ".release-please-manifest.json", "docs/sourcey.config.ts", "docs/package.json",
              "docs/package-lock.json", "pyproject.toml",
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pull.number,
              per_page: 100,
            });
            const blocked = files.map(({ filename }) => filename).filter((filename) =>
              sensitive.some((prefix) => filename === prefix || filename.startsWith(prefix)),
            );
            if (blocked.length) core.setFailed(`Fork pull requests cannot change sensitive control-plane files: ${blocked.join(", ")}`);

  gate:
    name: CI / gate
    if: always()
    needs: [test, quality, dependency-review, repository-policy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every applicable CI gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: value["result"] for name, value in results.items() if value["result"] not in {"success", "skipped"}}
          if failed:
              print(f"Required CI jobs did not succeed: {failed}", file=sys.stderr)
              raise SystemExit(1)
          PY
