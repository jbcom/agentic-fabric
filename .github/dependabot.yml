version: 2
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      sourcey:
        patterns: ["sourcey"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/agentic-fabric
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /packages/pytest-agentic-fabric
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      actions:
        patterns: ["*"]
